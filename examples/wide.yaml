# Six independent jobs of 2 seconds: with fewer agents they wait their turn.
# Submit it two or three times at once to see several pipelines competing for the agents.
name: wide
stages:
- stage: work
  jobs:
  - {job: j1, steps: [{task: Sleep@1, inputs: {seconds: 2}}]}
  - {job: j2, steps: [{task: Sleep@1, inputs: {seconds: 2}}]}
  - {job: j3, steps: [{task: Sleep@1, inputs: {seconds: 2}}]}
  - {job: j4, steps: [{task: Sleep@1, inputs: {seconds: 2}}]}
  - {job: j5, steps: [{task: Sleep@1, inputs: {seconds: 2}}]}
  - {job: j6, steps: [{task: Sleep@1, inputs: {seconds: 2}}]}