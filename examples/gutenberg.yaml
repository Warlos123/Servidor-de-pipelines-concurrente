# Analysis of "Pride and Prejudice" from Project Gutenberg with WordCount@1,
# Histogram@1 and shell statistics.
#
# Stages:
#   descargar  → curl of the book (~700 KB)
#   analizar   → three jobs IN PARALLEL:
#                  palabras    : WordCount@1 (top 20 words)
#                  histograma  : byte distribution histogram, 32 bins
#                  estadisticas: awk/sort → lines, chars, sentences, chapters
#   reportar   → consolidates the three artifacts into a readable report
#
# Usage: pipectl <host> <port> SUBMIT examples/gutenberg.yaml
name: gutenberg_analysis
variables:
  URL: "https://www.gutenberg.org/files/1342/1342-0.txt"
  LIBRO: "pride_and_prejudice.txt"
  TOP: "20"

stages:
# ─── Stage 1: download ───────────────────────────────────────────────────────
- stage: descargar
  jobs:
  - job: fetch
    # Job timeout in case the download hangs; complements the curl --max-time.
    timeoutInSeconds: 120
    steps:
    - script: echo "Downloading Pride and Prejudice (Project Gutenberg)..."
    - script: curl -sSf --max-time 60 -o $(LIBRO) "$(URL)"
    - script: |
        BYTES=$(wc -c < $(LIBRO))
        LINES=$(wc -l < $(LIBRO))
        echo "Download complete: ${BYTES} bytes, ${LINES} lines."
    - publish: $(LIBRO)
      artifact: libro_txt

# ─── Stage 2: three analyses in parallel ─────────────────────────────────────
- stage: analizar
  dependsOn: descargar
  jobs:

  - job: palabras
    steps:
    - download: libro_txt
      path: .
    - task: WordCount@1
      inputs:
        file: $(LIBRO)
        threads: 4
        output: wordcount.txt
        top: $(TOP)
    - publish: wordcount.txt
      artifact: resultado_palabras

  - job: histograma
    steps:
    - download: libro_txt
      path: .
    - task: Histogram@1
      inputs:
        file: $(LIBRO)
        bins: 32
        threads: 4
        output: histograma.csv
    - publish: histograma.csv
      artifact: resultado_histograma

  - job: estadisticas
    steps:
    - download: libro_txt
      path: .
    - script: |
        echo "Computing text statistics..."

        TOTAL_LINEAS=$(wc -l < $(LIBRO))
        TOTAL_PALABRAS=$(wc -w < $(LIBRO))
        TOTAL_CHARS=$(wc -c < $(LIBRO))

        # Sentences: counts periods, exclamation and question marks
        ORACIONES=$(grep -o '[.!?]' $(LIBRO) | wc -l)

        # Chapters: this edition uses "CHAPTER I." and also "Chapter I."
        CAPITULOS=$(grep -icE "^[[:space:]]*chapter [IVXL]+" $(LIBRO) || true)

        # Longest word: only the book body, between the Gutenberg START/END
        # markers. The tr handles \r because the file uses CRLF.
        PALABRA_LARGA=$(awk '/START OF THE PROJECT GUTENBERG/{on=1; next} /END OF THE PROJECT GUTENBERG/{exit} on' $(LIBRO) \
            | tr -s ' \t\r\n' '\n' \
            | awk '{ if(length($0)>max){max=length($0); w=$0}} END{print w, "(", max, "chars)"}')

        # Blank lines vs text lines
        LINEAS_VACIAS=$(grep -c "^$" $(LIBRO) || true)
        LINEAS_TEXTO=$((TOTAL_LINEAS - LINEAS_VACIAS))

        cat > estadisticas.txt << EOF
        === STATS: Pride and Prejudice ===
        Total lines     : ${TOTAL_LINEAS}
        Text lines      : ${LINEAS_TEXTO}
        Blank lines     : ${LINEAS_VACIAS}
        Total words     : ${TOTAL_PALABRAS}
        Total chars     : ${TOTAL_CHARS}
        Sentences approx: ${ORACIONES}
        Chapters        : ${CAPITULOS}
        Longest word    : ${PALABRA_LARGA}
        EOF
        cat estadisticas.txt
    - publish: estadisticas.txt
      artifact: resultado_estadisticas

# ─── Stage 3: final report ───────────────────────────────────────────────────
- stage: reportar
  dependsOn: analizar
  jobs:
  - job: consolidar
    steps:
    - download: resultado_palabras
      path: .
    - download: resultado_histograma
      path: .
    - download: resultado_estadisticas
      path: .
    - script: |
        echo ""
        echo "========================================================"
        echo "   FINAL REPORT — Pride and Prejudice (Jane Austen)"
        echo "========================================================"
        echo ""
        cat estadisticas.txt
        echo ""
        echo "--- Top $(TOP) most frequent words ---"
        cat wordcount.txt
        echo ""
        echo "--- Byte histogram (first 10 CSV rows) ---"
        head -10 histograma.csv
        echo ""
        echo "========================================================"
        echo "   Pipeline completed successfully."
        echo "========================================================"
