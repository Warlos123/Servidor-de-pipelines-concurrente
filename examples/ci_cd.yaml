# CI/CD with real git and a real remote server.
#
# Flow:
#   init      -> creates the remote: bare repo origin.git (the "git server"),
#                clones, initial commit on main and git push origin main
#   features  -> TWO JOBS IN PARALLEL:
#                clone from origin, create feature/greet and feature/math
#                and git push origin (each job publishes its server state)
#   integrate -> clone, git fetch from both remotes, merges --no-ff,
#                gcc build and git push of the integrated main
#   test      -> runs the compiled binary and verifies every function
#   release   -> clone, git tag v1.0.0 + push of the tag, tarball packaging
#
# The server travels as an artifact because jobs don't share a filesystem;
# every push/fetch is a real git push/fetch against a bare remote.
#
# Usage: pipectl <host> <port> SUBMIT examples/ci_cd.yaml
name: ci_cd_pipeline

stages:

# --- Stage 1: remote server + initial commit ----------------------------------
- stage: init
  jobs:
  - job: setup_repo
    steps:
    - script: |
        set -e
        echo "=== [INIT] Creating the remote git server (bare) ==="
        git -c init.defaultBranch=main init --bare origin.git
        git clone origin.git app 2>&1 | grep -v "warning:" || true
        cd app
        git config user.email "ci@pipeline.local"
        git config user.name "Pipeline Bot"
        printf '%s\n' \
          '#include <stdio.h>' \
          '' \
          'int main(void) {' \
          '    printf("CI/CD Pipeline Demo - initial build\n");' \
          '    return 0;' \
          '}' > main.c
        printf '%s\n' \
          'CC     = gcc' \
          'CFLAGS = -Wall -Wextra -pedantic' \
          'SRCS   = $(wildcard *.c)' \
          'TARGET = ci_demo' \
          'all: $(TARGET)' \
          '$(TARGET): $(SRCS)' \
          '	$(CC) $(CFLAGS) -o $(TARGET) $(SRCS)' \
          'clean:' \
          '	rm -f $(TARGET)' > Makefile
        git add main.c Makefile
        git commit -m "chore: initial commit on branch main"
        echo ""
        echo "Initial git log:"
        git log --oneline
        git push origin main
        echo "main published to origin."
    - publish: origin.git
      artifact: servidor_git

# --- Stage 2: features in parallel (2 feature branches) -----------------------
- stage: features
  dependsOn: init
  jobs:

  # Dev A: branch feature/greet
  - job: feature_greet
    steps:
    - download: servidor_git
      path: .
    - script: |
        set -e
        echo "=== [DEV A] Working on feature/greet ==="
        git clone origin.git app
        cd app
        git config user.email "dev-a@pipeline.local"
        git config user.name "Dev A"
        git checkout -b feature/greet
        printf '%s\n' \
          '#ifndef GREET_H' \
          '#define GREET_H' \
          'void greet(const char *name);' \
          'void greet_with_title(const char *title, const char *name);' \
          '#endif' > greet.h
        printf '%s\n' \
          '#include <stdio.h>' \
          '#include "greet.h"' \
          '' \
          'void greet(const char *name) {' \
          '    printf("Hello, %s! Welcome to the CI/CD pipeline.\n", name);' \
          '}' \
          '' \
          'void greet_with_title(const char *title, const char *name) {' \
          '    printf("Hello, %s %s!\n", title, name);' \
          '}' > greet.c
        git add greet.h greet.c
        git commit -m "feat: add greet module with greet() and greet_with_title()"
        echo ""
        echo "Branch feature/greet:"
        git log --oneline
        git diff main..feature/greet --stat
        git push origin feature/greet
    - publish: origin.git
      artifact: servidor_greet

  # Dev B: branch feature/math
  - job: feature_math
    steps:
    - download: servidor_git
      path: .
    - script: |
        set -e
        echo "=== [DEV B] Working on feature/math ==="
        git clone origin.git app
        cd app
        git config user.email "dev-b@pipeline.local"
        git config user.name "Dev B"
        git checkout -b feature/math
        printf '%s\n' \
          '#ifndef MATH_OPS_H' \
          '#define MATH_OPS_H' \
          'int add(int a, int b);' \
          'int multiply(int a, int b);' \
          'int factorial(int n);' \
          'int fibonacci(int n);' \
          '#endif' > math_ops.h
        printf '%s\n' \
          '#include "math_ops.h"' \
          '' \
          'int add(int a, int b)      { return a + b; }' \
          'int multiply(int a, int b) { return a * b; }' \
          '' \
          'int factorial(int n) {' \
          '    if (n <= 1) return 1;' \
          '    return n * factorial(n - 1);' \
          '}' \
          '' \
          'int fibonacci(int n) {' \
          '    if (n <= 1) return n;' \
          '    return fibonacci(n - 1) + fibonacci(n - 2);' \
          '}' > math_ops.c
        git add math_ops.h math_ops.c
        git commit -m "feat: add math_ops module (add, multiply, factorial, fibonacci)"
        echo ""
        echo "Branch feature/math:"
        git log --oneline
        git diff main..feature/math --stat
        git push origin feature/math
    - publish: origin.git
      artifact: servidor_math

# --- Stage 3: integrate -> build -----------------------------------------------
- stage: integrate
  dependsOn: features
  jobs:
  - job: merge_and_build
    steps:
    - download: servidor_greet
      path: servidor_greet
    - download: servidor_math
      path: servidor_math
    - script: |
        set -e
        echo "=== [INTEGRATE] Fetching remotes, merges and build ==="
        git clone servidor_greet/origin.git app
        cd app
        git config user.email "ci@pipeline.local"
        git config user.name "Pipeline Bot"
        git remote add math_server ../servidor_math/origin.git
        echo "--- Fetching feature/greet from origin..."
        git fetch origin
        echo "--- Fetching feature/math from math_server..."
        git fetch math_server
        echo ""
        echo "Available branches:"
        git branch -a
        echo ""
        echo "--- Merging feature/greet (Pull Request)..."
        git merge origin/feature/greet --no-ff -m "Merge pull request: feature/greet -> main"
        echo "--- Merging feature/math (Pull Request)..."
        git merge math_server/feature/math --no-ff -m "Merge pull request: feature/math -> main"
        echo ""
        echo "=== Git log --graph (full history) ==="
        git log --graph --oneline --all
        echo ""
        printf '%s\n' \
          '#include <stdio.h>' \
          '#include "greet.h"' \
          '#include "math_ops.h"' \
          '' \
          'int main(void) {' \
          '    printf("=== CI/CD Pipeline Demo v1.0 ===\n\n");' \
          '    greet("Pipeline");' \
          '    greet_with_title("Dr.", "Compiler");' \
          '    printf("\n");' \
          '    printf("2 + 3    = %d\n", add(2, 3));' \
          '    printf("4 x 5    = %d\n", multiply(4, 5));' \
          '    printf("7!       = %d\n", factorial(7));' \
          '    printf("fib(10)  = %d\n", fibonacci(10));' \
          '    return 0;' \
          '}' > main.c
        git add main.c
        git commit -m "build: integrate feature/greet and feature/math into main.c"
        echo "--- Publishing the integrated main to origin..."
        git push origin main
        echo ""
        echo "=== Compiling with gcc ==="
        gcc -Wall -Wextra -pedantic -o ci_demo main.c greet.c math_ops.c
        echo "Build successful. Binary: ci_demo"
        ls -lh ci_demo
        cp ci_demo ../ci_demo
    - publish: servidor_greet/origin.git
      artifact: servidor_integrado
    - publish: ci_demo
      artifact: app_binary

# --- Stage 4: automated tests of the binary ------------------------------------
- stage: test
  dependsOn: integrate
  jobs:
  - job: run_tests
    steps:
    - download: app_binary
      path: .
    - script: |
        echo "=== [TEST] Running the test suite ==="
        chmod +x ci_demo
        OUTPUT=$(./ci_demo)
        echo "Program output:"
        echo "--------------------"
        echo "$OUTPUT"
        echo "--------------------"
        echo ""
        PASS=0
        FAIL=0
        check() {
            if echo "$OUTPUT" | grep -qF "$2"; then
                echo "PASS: $1"
                PASS=$((PASS+1))
            else
                echo "FAIL: $1  (expected: $2)"
                FAIL=$((FAIL+1))
            fi
        }
        check "Header v1.0"       "CI/CD Pipeline Demo v1.0"
        check "greet(Pipeline)"   "Hello, Pipeline"
        check "greet_with_title"  "Dr. Compiler"
        check "add(2,3)=5"        "2 + 3    = 5"
        check "multiply(4,5)=20"  "4 x 5    = 20"
        check "factorial(7)=5040" "7!       = 5040"
        check "fibonacci(10)=55"  "fib(10)  = 55"
        echo ""
        echo "Result: $PASS passed, $FAIL failed."
        if [ "$FAIL" -gt 0 ]; then
            echo "TESTS FAILED. Aborting pipeline."
            exit 1
        fi
        echo "All tests passed. Ready for release."

# --- Stage 5: release -----------------------------------------------------------
- stage: release
  dependsOn: test
  jobs:
  - job: tag_and_package
    steps:
    - download: servidor_integrado
      path: servidor_integrado
    - download: app_binary
      path: .
    - script: |
        set -e
        echo "=== [RELEASE] Creating release v1.0.0 ==="
        git clone servidor_integrado/origin.git app
        cd app
        git config user.email "ci@pipeline.local"
        git config user.name "Pipeline Bot"
        git tag -a v1.0.0 -m "Release v1.0.0: greet + math_ops"
        echo ""
        echo "--- Publishing the tag to origin..."
        git push origin v1.0.0
        echo ""
        echo "Tags:"
        git tag -l -n1
        echo ""
        cp ../ci_demo .
        mkdir -p dist/bin dist/src
        cp ci_demo      dist/bin/
        cp *.c *.h      dist/src/
        printf '%s\n' \
          '# Release v1.0.0' \
          '' \
          '## New features' \
          '- **greet**: greet() and greet_with_title()' \
          '- **math_ops**: add(), multiply(), factorial(), fibonacci()' \
          '' \
          '## CI/CD' \
          '- 2 feature branches with git push to a bare remote (origin.git)' \
          '- --no-ff merges and integrated main published to origin' \
          '- Build: gcc -Wall -Wextra -pedantic (0 warnings)' \
          '- Tests: 7/7 passed' \
          '- Tag v1.0.0 pushed to origin' > dist/RELEASE_NOTES.md
        cd ..
        tar -czf ci_demo_v1.0.0.tar.gz -C app/dist .
        echo "Release contents:"
        tar -tzf ci_demo_v1.0.0.tar.gz
        echo ""
        echo "=== Release v1.0.0 ready. Pipeline completed successfully. ==="
    - publish: servidor_integrado/origin.git
      artifact: servidor_final
    - publish: ci_demo_v1.0.0.tar.gz
      artifact: release_v1_0_0
