# Fan-out / fan-in: one corpus shared by 3 parallel jobs and a final report.
#
# preparar : generates the text corpus and publishes it.
# analizar : 3 independent jobs run IN PARALLEL over the same corpus:
#              - word_count  → word count
#              - histogram   → byte histogram
#              - cpu_hash    → deterministic CPU work (checksum)
# integrar : ONE job downloads the three results and builds the final report.
#
# Usage: pipectl <host> <port> SUBMIT examples/fan_out_fan_in.yaml
name: fan_out_fan_in_demo
stages:
- stage: preparar
  jobs:
  - job: generar_corpus
    steps:
    - script: |
        python3 -c "
        import random, string
        words = ['pipeline','concurrente','paralelo','datos','tarea','etapa',
                 'trabajo','resultado','artefacto','nodo','grafo','dag']
        lines = [' '.join(random.choices(words, k=8)) for _ in range(3000)]
        print('\n'.join(lines))
        " > corpus.txt
    - script: |
        echo "Corpus generated. Lines: $(wc -l < corpus.txt)"
    - publish: corpus.txt
      artifact: corpus_shared

- stage: analizar
  dependsOn: preparar
  jobs:
  - job: word_count
    steps:
    - download: corpus_shared
      path: .
    - task: WordCount@1
      inputs:
        file: corpus.txt
        threads: 2
        output: words.txt
        top: 10
    - publish: words.txt
      artifact: resultado_words

  - job: histogram
    steps:
    - download: corpus_shared
      path: .
    - task: Histogram@1
      inputs:
        file: corpus.txt
        bins: 32
        threads: 2
        output: hist.csv
    - publish: hist.csv
      artifact: resultado_hist

  - job: cpu_hash
    steps:
    - task: Cpu@1
      inputs:
        iterations: 50000000
        seed: 42
    - script: echo "CPU work completed (corpus checksum)"

- stage: integrar
  dependsOn: analizar
  jobs:
  - job: reporte_final
    steps:
    - download: resultado_words
      path: .
    - download: resultado_hist
      path: .
    - script: |
        echo "============================================"
        echo "  FINAL REPORT - fan-out / fan-in demo"
        echo "============================================"
        echo ""
        echo "--- Top words ---"
        cat words.txt
        echo ""
        echo "--- Histogram (first 5 rows) ---"
        head -5 hist.csv
        echo "============================================"
