name: bench_metrics
variables:
  THREADS: 4
stages:
  - stage: DataPrep
    jobs:
      - job: GenerateData
        steps:
          - script: head -c 10M /dev/urandom > data.bin
          - publish: data.bin
            artifact: raw_data
  - stage: Processing
    jobs:
      - job: WordCount
        steps:
          - download: raw_data
            path: .
          - task: WordCount@1
            inputs:
              file: data.bin
              threads: $(THREADS)
              output: wc.txt
      - job: Histogram
        steps:
          - download: raw_data
            path: .
          - task: Histogram@1
            inputs:
              file: data.bin
              threads: $(THREADS)
              output: hist.csv
              bins: 256
