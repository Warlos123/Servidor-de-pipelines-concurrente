name: bench_data_hist
# Data-parallel data task benchmark. bench/run.sh replaces @CORPUS@ with the
# absolute path of the generated corpus and @THREADS@ with the number of
# OpenMP threads for this run.
stages:
- stage: count
  jobs:
  - job: hist
    steps:
    - task: Histogram@1
      inputs: {file: @CORPUS@, threads: @THREADS@, bins: 256, output: hist_result.csv}
